<body>
  <header>header</header>
  <nav>
    <ul>

  <main>
    <h1>Encabezado principal en main</h1>
    <div class="contenedor">
      <section>
        <h2>Encabezado de sección</h2>
        <article>
          <h3>Encabezado de artículo</h3>
          <form action="">
            <fieldset class="grid">
              <legend>Proporciona tus datos</legend>
              <div class="campo nombre">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre">
              </div>
              <div class="campo correo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email">
              </div>
              <div class="campo procede">
                <span>Procedencia</span>
                <div class="op-procede">
                  <input type="radio" name="procedencia" id="mex" value="mex">
                  <label for="mex">Mexicano</label>
                  <input type="radio" name="procedencia" id="ext" value="ext">
                  <label for="ext">Extranjero</label>
                </div>
              </div>
              <div class="campo sabor">
                <label for="sabor">Sabor favorito</label>
                <select id="sabor">
                  <option value="">- Elija una opción -</option>
                  <option value="fresa">Fresa</option>
                  <option value="vainilla">Vainilla</option>
                  <option value="chocolate">Chocolate</option>
                </select>
              </div>
            </fieldset>
          </form>
          <p>Parrafo en artículo</p>
        </article>
      </section>
      <aside>
        <h3>Encabezado en lateral</h3>
        <dl>
          <dt>Termino</dt>
          <dd>
            <p>La descripción</p>
          </dd>
          <dt>Termino</dt>

            <p>La descripción</p>
          </dd>
          <dt>Termino</dt>
          <dd>
            <p>La descripción</p>
          </dd>
        </dl>
      </aside>
    </div>
  </main>
  <footer>footer</footer>
</body>
</html>
